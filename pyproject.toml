[project]
name = "nebula"
version = "0.1.0"
description = "Daily Time Allocation — a floating macOS time-awareness widget"
requires-python = ">=3.13"
dependencies = [
    "pywebview>=5.4",
]

[project.scripts]
nebula = "nebula.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nebula"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
